<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groww Account · Grow Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f0f2f5;--border:#e3e6eb;
  --text:#14171c;--muted:#5f6876;--accent:#0b8a6a;--accent-soft:#e3f4ef;
  --danger:#c2410c;--danger-soft:#fdeee6;--warn:#a16207;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1014;--surface:#151a20;--surface-2:#1c232b;--border:#26303a;
  --text:#e7ebf0;--muted:#8d98a6;--accent:#2fc79c;--accent-soft:#12322a;
  --danger:#fb8a5c;--danger-soft:#3a1d12;--warn:#e7b549;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0d1014;--surface:#151a20;--surface-2:#1c232b;--border:#26303a;
  --text:#e7ebf0;--muted:#8d98a6;--accent:#2fc79c;--accent-soft:#12322a;
  --danger:#fb8a5c;--danger-soft:#3a1d12;--warn:#e7b549;--shadow:none;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
header h1{font-size:16px;margin:0;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)} .dot.bad{background:var(--danger)}
.spacer{flex:1}
button{font:inherit;border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .value{font-size:22px;font-weight:600;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.card h2{font-size:13px;margin:0;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600}
.card h3{font-size:12px;color:var(--muted);margin:0;padding:10px 16px 4px;text-transform:uppercase;letter-spacing:.04em}
dl{margin:0;padding:4px 16px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
dt{color:var(--muted)} dd{margin:0;text-align:right}
.state{padding:28px 16px;color:var(--muted);text-align:center}
.state.error{color:var(--danger);background:var(--danger-soft)}
.skel{height:12px;border-radius:6px;background:var(--surface-2);margin:10px 16px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.5}}
.banner{display:none;padding:12px 16px;border-radius:10px;background:var(--danger-soft);color:var(--danger);margin-bottom:16px}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.off{background:var(--surface-2);color:var(--muted)}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Groww Account</h1>
  <a href="/" style="color:var(--muted);margin-left:12px">Backtest</a><a href="/compare" style="color:var(--muted);margin-left:12px">Compare</a><a href="/signals" style="color:var(--muted);margin-left:12px">Signals</a><a href="/live" style="color:var(--muted);margin-left:12px">Live / Paper</a><a href="/data" style="color:var(--muted);margin-left:12px">Data</a><a href="/history" style="color:var(--muted);margin-left:12px">History</a>
  <span class="spacer"></span>
  <button id="refresh">Refresh</button>
  <button id="relogin">Re-login</button>
  <button id="theme" aria-label="Toggle theme">◐</button>
</header>
<main>
  <div class="banner" id="banner"></div>
  <section class="kpis" id="kpis"></section>
  <section class="grid">
    <div class="card"><h2>Profile</h2><div id="profile"></div></div>
    <div class="card"><h2>Funds &amp; margin</h2><div id="funds"></div></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const inr = v => typeof v === "number"
  ? "₹" + v.toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : v;
const label = k => k.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fmt(key, v) {
  if (typeof v === "boolean") return `<span class="pill ${v ? "" : "off"}">${v ? "Yes" : "No"}</span>`;
  if (Array.isArray(v)) return v.length ? v.map(x => `<span class="pill">${esc(x)}</span>`).join(" ") : "—";
  if (typeof v === "number" && !/count|id|qty|quantity/i.test(key)) return `<span class="num">${inr(v)}</span>`;
  if (v === null || v === undefined || v === "") return "—";
  return `<span class="num">${esc(v)}</span>`;
}
function renderDict(obj) {
  const flat = [], nested = [];
  for (const [k, v] of Object.entries(obj || {}))
    (v && typeof v === "object" && !Array.isArray(v) ? nested : flat).push([k, v]);
  let html = flat.length ? `<dl>${flat.map(([k, v]) => `<dt>${label(k)}</dt><dd>${fmt(k, v)}</dd>`).join("")}</dl>` : "";
  for (const [k, v] of nested) html += `<h3>${label(k)}</h3>` + renderDict(v);
  return html || `<div class="state">No data returned.</div>`;
}
const loading = () => `<div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:85%"></div>`;
const errorBox = m => `<div class="state error">${esc(m)}</div>`;

async function get(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({ok: false, error: `HTTP ${r.status}`}));
  if (!j.ok) throw Object.assign(new Error(j.error), {kind: j.kind});
  return j.data;
}
function kpi(lbl, v) { return `<div class="kpi"><div class="label">${lbl}</div><div class="value num">${v}</div></div>`; }

async function load() {
  $("#profile").innerHTML = $("#funds").innerHTML = loading();
  $("#kpis").innerHTML = ""; $("#banner").style.display = "none";
  const [p, f] = await Promise.allSettled([get("/api/profile"), get("/api/funds")]);
  const ok = p.status === "fulfilled" && f.status === "fulfilled";
  $("#dot").className = "dot " + (ok ? "ok" : "bad");
  const failed = [p, f].find(r => r.status === "rejected");
  if (failed) { $("#banner").textContent = failed.reason.message; $("#banner").style.display = "block"; }
  $("#profile").innerHTML = p.status === "fulfilled" ? renderDict(p.value) : errorBox(p.reason.message);
  if (f.status === "fulfilled") {
    const d = f.value || {};
    const pick = (...ks) => { for (const k of ks) if (typeof d[k] === "number") return d[k]; };
    const cards = [["Available cash", pick("clearing_cash", "available_cash")],
                   ["Margin used", pick("net_margin_used", "margin_used")],
                   ["Collateral", pick("collateral_available")],
                   ["F&O available", d.fno_margin_details?.option_buy_balance_available]]
      .filter(([, v]) => typeof v === "number");
    $("#kpis").innerHTML = cards.map(([l, v]) => kpi(l, inr(v))).join("");
    $("#funds").innerHTML = renderDict(d);
  } else $("#funds").innerHTML = errorBox(f.reason.message);
}

$("#refresh").onclick = load;
$("#relogin").onclick = async () => {
  try { await get("/api/login", {method: "POST"}); } catch (e) {}
  load();
};
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
};
load();
</script>
</body>
</html>
